; Launch MT5 with this file to auto-attach the bridge EA to XAUUSD H1:
;   Windows:  terminal64.exe /config:startup-ExportOHLCV.ini
;   Mac (Wine-wrapped app): copy this file into the terminal's config\ folder, or attach manually (see docs/architecture/mt5-bridge.md)
[StartUp]
Expert=ExportOHLCV
Symbol=XAUUSD
Period=H1
ExpertParameters=ExportOHLCV.set
