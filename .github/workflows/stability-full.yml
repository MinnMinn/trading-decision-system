# Full-universe stability regeneration (owner, 2026-09-27): every crypto execution symbol, every MT5 CFD
# execution symbol (metals + index CFDs; USOIL/UKOIL removed -- the MT5 account carries neither; forex removed
# by the owner the same day). One market per file: stability-report prices a run by the market of its first
# symbol, so markets are never mixed in one run.
#
# Three stages (owner-approved 2026-09-28, after all four CFD jobs hit the 6 h job limit on run 36361889130):
#   plan    -- lists every distinct scan (stability-report.py --list-scans) and the report jobs;
#   scan    -- ONE job per scan, filling a scan cache (scripts/scan_cache.py) uploaded as its own artifact, so
#              no job runs 72 scans in a row and a crash or timeout costs one scan;
#   report  -- one job per (market, account): downloads the market's scans and builds the stability file with
#              --require-cached, so it simulates only and can never silently fall back to hours of scanning.
# A scan does not depend on the account, so the four accounts of a market share every scan.
name: stability-full

on:
  push:
    branches: ["research-full/**"]
  workflow_dispatch:
    inputs:
      markets:
        description: "comma-separated markets to regenerate (CRYPTO, CFD)"
        default: "CRYPTO,CFD"

permissions:
  contents: read

env:
  CRYPTO: "BTCUSDT,ETHUSDT,SOLUSDT,ASTERUSDT,VIRTUALUSDT,SUIUSDT,TAOUSDT,RENDERUSDT,ONDOUSDT"
  CFD: "XAUUSD,XAGUSD,US500,US30,USTEC,DE40,FRA40,AUS200"
  TFS: "15m,1H,4H"
  MARKETS: ${{ inputs.markets || 'CRYPTO,CFD' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scans: ${{ steps.plan.outputs.scans }}
      reports: ${{ steps.plan.outputs.reports }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: plan
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          accounts = {"CRYPTO": ["", "crypto-personal-v1", "crypto-prop-discipline", "pilot-binance-futures-testnet"],
                      "CFD": ["", "ftmo-challenge-phase1", "the5ers-high-stakes-step1", "pilot-mt5-demo"]}
          scans, reports = [], []
          for m in [x.strip() for x in os.environ["MARKETS"].split(",") if x.strip()]:
              out = subprocess.run(["python", "scripts/stability-report.py", "--list-scans", "--tf", os.environ["TFS"],
                                    "--symbols", os.environ[m]], check=True, capture_output=True, text=True).stdout
              scans += [dict(s, market=m) for s in json.loads(out.strip().splitlines()[-1])]
              reports += [dict(market=m, account=a, name=f"{m.lower()}-{a or 'live'}") for a in accounts[m]]
          print("scans=" + json.dumps(scans))
          print("reports=" + json.dumps(reports))
          EOF
          cat "$GITHUB_OUTPUT" | cut -c1-300

  scan:
    needs: plan
    name: scan ${{ matrix.market }} ${{ matrix.symbol }} ${{ matrix.tf }} ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scans) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: scan into the cache
        env:
          PYTHONUTF8: "1"
        run: |
          # Outside the checkout: a file inside the work tree makes code_version read dirty=true (CLAUDE.md §46).
          python -X faulthandler scripts/stability-report.py --scan-only --scan-cache "$RUNNER_TEMP/cache" \
            --symbols "${{ matrix.symbol }}" --tf "${{ matrix.tf }}" --scan-configs "${{ matrix.config }}" \
            --ict-target range --workers 1
      - uses: actions/upload-artifact@v6
        with:
          name: scan-${{ matrix.market }}-${{ matrix.symbol }}-${{ matrix.tf }}-${{ matrix.config }}
          path: ${{ runner.temp }}/cache/
          retention-days: 7

  report:
    needs: [plan, scan]
    # A failed scan job still lets the reports run (and --require-cached names what is missing); a failed plan
    # does not -- there is no matrix to expand.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: stability ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.reports) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: scan-${{ matrix.market }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/cache
      - name: stability-report (cached scans only)
        env:
          PYTHONUTF8: "1"
          SYMBOLS: ${{ env[matrix.market] }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          acct=()
          if [ -n "${{ matrix.account }}" ]; then acct=(--account "${{ matrix.account }}"); fi
          python -X faulthandler scripts/stability-report.py --tf "$TFS" --symbols "$SYMBOLS" \
            --ict-target range --json "$out/${{ matrix.name }}.json" --workers 1 \
            --scan-cache "$RUNNER_TEMP/cache" --require-cached "${acct[@]}" \
            > "$out/${{ matrix.name }}.stdout.md" 2> "$out/${{ matrix.name }}.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stability-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

  collect:
    needs: report
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: stability-*
          path: results
      - name: push results branch
        run: |
          cd results
          git init -q -b "research-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run %s attempt %s (stability-full)\nsource commit %s (%s)\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF_NAME" > RUN.txt
          git add -A
          git commit -q -m "stability-full results: run ${GITHUB_RUN_ID} of ${GITHUB_SHA}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/research-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
