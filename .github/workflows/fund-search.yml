# The FUND-SETUP search (docs/plans/2026-09-28-methodology-improvement-plan.md §1.4, §3, §6; execution plan
# Batch 2(b)). Scan-sharded (docs/audits/2026-09-30-actions-sharding.md):
#
#   plan            lists the committed cells and the scan shards (`list-cells`, `list-scan-shards`);
#   scan_wave1      one job per (cell, method, symbol, slice): the raw scans of the wave-1 value sets of ONE symbol,
#                   uploaded as a verified scan-cache artifact (fund-scan-<cell>-<method>-<symbol>-w1-s<slice>);
#   scan_wave2      the same for wave 2 -- the value sets that only exist once selection has run on the POOLED wave-1
#                   trades of every symbol of the cell, so each job downloads the cell's complete wave 1 first;
#   evaluate        one job per cell (both methods): downloads that cell's scan artifacts and runs `run --scan-cache`.
#                   Nothing statistical is sharded: pooling across symbols, walk-forward, stability and every verdict
#                   are still computed in this ONE step, from a cache that is byte-for-byte what a cache-less run scans;
#   report          merges every cell's records and writes the report over ALL of them.
#
# NOT triggered by a push: workflow_dispatch only. Batch 3 (the single evaluation) needs owner sign-off, so nothing
# here starts on its own. `scan` and `run` both refuse unless (a) docs/experiments/fund-search/plan.json matches the
# recomputed cell space and (b) docs/architecture/research-ledger.json records the final cell count
# (scripts/fund-search.py `declare`) -- the ledger declaration precedes every scan and every evaluation. A scan-cache
# entry made by other code / plan / settings / history is REFUSED by `run` and by `scan --wave 2` (never silently used).
#
# Wave-2 tripwire / override: wave 2 is sized by an ESTIMATE (scripts/fund-search.py WAVE2_SETS_FIXED / WAVE2_SETS_PER_FOLD x
# WAVE2_SAFETY_MARGIN, measured under the sealed perturbation definition: docs/audits/2026-10-01-shard-calibration.md section 10;
# each wave's matrix stays within GitHub's 256-job limit: `list-scan-shards --wave N` is checked by the layout test); a wave-2 shard that finds
# its real list >10 % longer prints "WARNING: ... --slice I/N" to stderr (the job log). To re-slice, re-run every wave-2 slice of that
# (cell, method, symbol) with the printed N (entries are keyed per value set, any N gives the same cache). Before `declare`, record the
# runner speed with fund-search-benchmark.yml (docs/audits/2026-10-01-shard-calibration.md section 6).
#
# Outputs land OUTSIDE the checkout (a file written inside the work tree makes the run's own code_version read
# dirty=true, CLAUDE.md §46), matching prop-search.yml and stability-full.yml. Nothing is pushed: results leave as
# artifacts only. fetch-depth 0: the code fingerprint is the last-commit SHA of each pinned file, which a depth-1
# clone cannot answer (every file would report the same commit and read as drift against the declaration).
name: fund-search

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "parallel candidate worker processes inside a cell (one process per candidate)"
        default: "2"
      scan_workers:
        description: "scan pool processes inside a scan shard (the memory clamp in scan_many may lower it)"
        default: "4"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # The fund search reads the FTMO feed committed under data/history/ftmo (also main()'s own default): set here so
  # no shard can silently read another history root.
  BT_HISTORY_ROOT: ${{ github.workspace }}/data/history/ftmo

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
      shards_w1: ${{ steps.plan.outputs.shards_w1 }}
      shards_w2: ${{ steps.plan.outputs.shards_w2 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: plan
        run: |
          # the plan must be COMMITTED (a plan written by this job would exist only in this job's checkout)
          git ls-files --error-unmatch docs/experiments/fund-search/plan.json
          # `plan` must match the committed plan exactly (load_plan refuses a drifted one with a nonzero exit).
          python scripts/fund-search.py plan
          echo "cells=$(python scripts/fund-search.py list-cells | tail -1)" >> "$GITHUB_OUTPUT"
          echo "shards_w1=$(python scripts/fund-search.py list-scan-shards --wave 1 | tail -1)" >> "$GITHUB_OUTPUT"
          echo "shards_w2=$(python scripts/fund-search.py list-scan-shards --wave 2 | tail -1)" >> "$GITHUB_OUTPUT"

  scan_wave1:
    needs: plan
    name: scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards_w1) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: scan wave 1 of one symbol (refuses without the ledger declaration)
        env:
          # Inputs and matrix values reach the shell through env, never interpolated into the script text (fix round 1, S5).
          INPUT_SCAN_WORKERS: ${{ inputs.scan_workers }}
          MATRIX_CELL: ${{ matrix.cell }}
          MATRIX_METHOD: ${{ matrix.method }}
          MATRIX_SYMBOL: ${{ matrix.symbol }}
          MATRIX_SLICE: ${{ matrix.slice }}
        run: |
          WORKERS="${INPUT_SCAN_WORKERS:-4}"
          case "$WORKERS" in ''|*[!0-9]*) echo "scan_workers must be a positive integer, got: $WORKERS" >&2; exit 1;; esac
          if [ "$WORKERS" -lt 1 ]; then echo "scan_workers must be >= 1" >&2; exit 1; fi
          case "$MATRIX_CELL" in *[!A-Za-z0-9_-]*|'') echo "bad cell id" >&2; exit 1;; esac
          case "$MATRIX_METHOD" in ict|wyckoff) ;; *) echo "bad method" >&2; exit 1;; esac
          case "$MATRIX_SYMBOL" in *[!A-Za-z0-9_]*|'') echo "bad symbol" >&2; exit 1;; esac
          case "$MATRIX_SLICE" in *[!0-9/]*|'') echo "bad slice" >&2; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/out/scan"
          python -X faulthandler scripts/fund-search.py scan --cell "$MATRIX_CELL" --method "$MATRIX_METHOD" \
            --symbol "$MATRIX_SYMBOL" --wave 1 --slice "$MATRIX_SLICE" --workers "$WORKERS" \
            --out "$RUNNER_TEMP/out/scan" \
            > "$RUNNER_TEMP/out/scan.stdout.log" 2> "$RUNNER_TEMP/out/scan.stderr.log" \
            || { rc=$?; tail -n 40 "$RUNNER_TEMP/out/scan.stderr.log" >&2; exit "$rc"; }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fund-scan-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          overwrite: true

  scan_wave2:
    needs: [plan, scan_wave1]
    name: scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards_w2) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: this cell/method's complete wave 1
        uses: actions/download-artifact@v7
        with:
          pattern: fund-scan-${{ matrix.cell }}-${{ matrix.method }}-*-w1-*
          path: ${{ runner.temp }}/wave1
          merge-multiple: true
      - name: scan wave 2 of one symbol (refuses on an incomplete wave 1, a foreign cache, or no declaration)
        env:
          INPUT_SCAN_WORKERS: ${{ inputs.scan_workers }}
          MATRIX_CELL: ${{ matrix.cell }}
          MATRIX_METHOD: ${{ matrix.method }}
          MATRIX_SYMBOL: ${{ matrix.symbol }}
          MATRIX_SLICE: ${{ matrix.slice }}
        run: |
          WORKERS="${INPUT_SCAN_WORKERS:-4}"
          case "$WORKERS" in ''|*[!0-9]*) echo "scan_workers must be a positive integer, got: $WORKERS" >&2; exit 1;; esac
          if [ "$WORKERS" -lt 1 ]; then echo "scan_workers must be >= 1" >&2; exit 1; fi
          case "$MATRIX_CELL" in *[!A-Za-z0-9_-]*|'') echo "bad cell id" >&2; exit 1;; esac
          case "$MATRIX_METHOD" in ict|wyckoff) ;; *) echo "bad method" >&2; exit 1;; esac
          case "$MATRIX_SYMBOL" in *[!A-Za-z0-9_]*|'') echo "bad symbol" >&2; exit 1;; esac
          case "$MATRIX_SLICE" in *[!0-9/]*|'') echo "bad slice" >&2; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/out/scan" "$RUNNER_TEMP/wave1"
          python -X faulthandler scripts/fund-search.py scan --cell "$MATRIX_CELL" --method "$MATRIX_METHOD" \
            --symbol "$MATRIX_SYMBOL" --wave 2 --slice "$MATRIX_SLICE" --workers "$WORKERS" \
            --scan-cache "$RUNNER_TEMP/wave1" --out "$RUNNER_TEMP/out/scan" \
            > "$RUNNER_TEMP/out/scan.stdout.log" 2> "$RUNNER_TEMP/out/scan.stderr.log" \
            || { rc=$?; tail -n 40 "$RUNNER_TEMP/out/scan.stderr.log" >&2; exit "$rc"; }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fund-scan-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          overwrite: true

  evaluate:
    # Default `needs` semantics on purpose: one failed scan shard skips EVERY evaluate job (of every cell -- `needs` is
    # per job, not per matrix entry), rather than letting a cell fall back to a multi-hour on-demand scan that the
    # 355-minute cap would kill; `--require-complete-scan-cache` below makes that fallback impossible anyway. Alternative:
    # `if: ${{ !cancelled() }}` here runs every cell whose own artifacts happen to be complete and fails the others fast
    # (docs/audits/2026-09-30-actions-sharding.md section 4). "Re-run failed jobs" repeats the failed shards and then
    # the jobs downstream of them.
    needs: [plan, scan_wave2]
    name: evaluate ${{ matrix.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: this cell's scan shards (both methods, both waves)
        uses: actions/download-artifact@v7
        with:
          pattern: fund-scan-${{ matrix.cell }}-*
          path: ${{ runner.temp }}/scan-cache
          merge-multiple: true
      - name: run one cell from the scan cache (refuses without the ledger declaration)
        env:
          FUND_SEARCH_RECORDS_DIR: ${{ runner.temp }}/out/records
          # Inputs reach the shell through env, never interpolated into the script text (fix round 1, S5).
          INPUT_WORKERS: ${{ inputs.workers }}
          MATRIX_CELL: ${{ matrix.cell }}
        run: |
          WORKERS="${INPUT_WORKERS:-2}"
          case "$WORKERS" in ''|*[!0-9]*) echo "workers must be a positive integer, got: $WORKERS" >&2; exit 1;; esac
          if [ "$WORKERS" -lt 1 ]; then echo "workers must be >= 1" >&2; exit 1; fi
          case "$MATRIX_CELL" in *[!A-Za-z0-9_-]*|'') echo "bad cell id" >&2; exit 1;; esac
          mkdir -p "$FUND_SEARCH_RECORDS_DIR" "$RUNNER_TEMP/scan-cache"
          python -X faulthandler scripts/fund-search.py run --cell "$MATRIX_CELL" --workers "$WORKERS" \
            --scan-cache "$RUNNER_TEMP/scan-cache" --require-complete-scan-cache \
            > "$RUNNER_TEMP/out/run.stdout.log" 2> "$RUNNER_TEMP/out/run.stderr.log" \
            || { rc=$?; tail -n 40 "$RUNNER_TEMP/out/run.stderr.log" >&2; exit "$rc"; }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fund-cell-${{ matrix.cell }}
          path: ${{ runner.temp }}/out/
          retention-days: 90

  report:
    needs: evaluate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: fund-cell-*
          path: ${{ runner.temp }}/cells
      - name: merge every cell's records, then report over ALL of them
        env:
          FUND_SEARCH_RECORDS_DIR: ${{ runner.temp }}/merged/records
          FUND_SEARCH_REPORT_PATH: ${{ runner.temp }}/merged/fund-search-report.md
        run: |
          mkdir -p "$FUND_SEARCH_RECORDS_DIR"
          for d in "$RUNNER_TEMP"/cells/*/; do
            if compgen -G "$d/records/*.json" > /dev/null; then cp "$d"/records/*.json "$FUND_SEARCH_RECORDS_DIR"/; fi
          done
          python scripts/fund-search.py report
