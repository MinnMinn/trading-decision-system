# The owner's PRE-REGISTERED prop-challenge setup search (docs/plans/2026-09-27-prop-setup-search-
# preregistration.md). Modelled on .github/workflows/stability-full.yml: outputs land OUTSIDE the checkout
# (a file written inside the work tree makes the run's own code_version read dirty=true, CLAUDE.md §46), and
# results are collected onto a dedicated research-results/<run id>-<attempt> branch rather than committed back
# to the source branch.
#
# `plan` is run FIRST and must match the committed docs/experiments/prop-search-2026-09-27/plan.json exactly
# (scripts/prop-search.py load_plan() refuses a drifted plan with a nonzero exit) -- the candidate space is
# pre-registered, not regenerated by CI. Only THEN does `run` evaluate candidates, and `report` is written
# last so a partial run (budget/time exhausted) still produces a report over whatever was recorded.
name: prop-search

on:
  push:
    branches: ["research-prop/**"]
  workflow_dispatch:
    inputs:
      workers:
        description: "parallel candidate-evaluation worker processes"
        default: "2"
      only:
        description: "comma-separated candidate ids to (re)run instead of the whole plan (optional)"
        default: ""

permissions:
  contents: read

jobs:
  search:
    name: prop-search
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: plan (must match the committed plan)
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/prop-search.py plan
      - name: run
        env:
          PYTHONUTF8: "1"
          # Outputs go to the runner's temp dir, NOT the checkout -- see the file header. PLAN_PATH stays
          # inside the checkout (scripts/prop-search.py never redirects it): it is the committed artifact
          # `plan` above just verified against.
          PROP_SEARCH_RECORDS_DIR: ${{ runner.temp }}/out/records
          PROP_SEARCH_SKIPPED_PATH: ${{ runner.temp }}/out/skipped.json
          PROP_SEARCH_REPORT_PATH: ${{ runner.temp }}/out/prop-search-report.md
        run: |
          mkdir -p "$PROP_SEARCH_RECORDS_DIR"
          args=(run --workers "${{ inputs.workers || 2 }}")
          if [ -n "${{ inputs.only }}" ]; then args+=(--only "${{ inputs.only }}"); fi
          python -X faulthandler scripts/prop-search.py "${args[@]}" \
            > "$RUNNER_TEMP/out/run.stdout.log" 2> "$RUNNER_TEMP/out/run.stderr.log"
      - name: report
        if: always()
        env:
          PYTHONUTF8: "1"
          PROP_SEARCH_RECORDS_DIR: ${{ runner.temp }}/out/records
          PROP_SEARCH_SKIPPED_PATH: ${{ runner.temp }}/out/skipped.json
          PROP_SEARCH_REPORT_PATH: ${{ runner.temp }}/out/prop-search-report.md
        run: |
          python scripts/prop-search.py report || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: prop-search-results
          path: ${{ runner.temp }}/out/
          retention-days: 90

  collect:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results
      - name: push results branch
        run: |
          cd results
          git init -q -b "research-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run %s attempt %s (prop-search)\nsource commit %s (%s)\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF_NAME" > RUN.txt
          git add -A
          git commit -q -m "prop-search results: run ${GITHUB_RUN_ID} of ${GITHUB_SHA}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/research-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
