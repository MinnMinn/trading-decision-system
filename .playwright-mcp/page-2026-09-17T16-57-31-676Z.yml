      - text: "PS Â· SC Â· AR Â· ST Preliminary Support, Selling Climax, Automatic Rally, Secondary Test â€” the four Phase A events of an accumulation; the TR is built from the AR high and the SC/ST low (knowledge/wyckoff/advance.md Â§2.7). Spring / Shakeout / Test Phase C: a penetration below the TR that closes back inside; type 1/2/3 by volume (knowledge/wyckoff/modern-tools.md Â§2.6); the Test is the revisit on lower volume. SOS Â· LPS Â· BU Phase D: Sign of Strength, Last Point of Support, Back-Up (the revisit of the broken area). PSY Â· BC Â· UT Â· UTAD Â· SOW Â· LPSY The matching distribution events; UT/UTAD belong to distribution only, UA to accumulation only (WA p8, knowledge/wyckoff/advance.md Â§1.3). CHoBEV / CHoCH Three CHoBEV make one CHoCH â€” the mandatory gate before any phase label is assigned (knowledge/wyckoff/advance.md Â§2.6). Effort vs Result Compare candle range against volume: in harmony = continuation, diverging = exhaustion or absorption (knowledge/wyckoff/advance.md Â§2.2, Â§4.1). Phases Aâ€“E Stop the trend â†’ build the cause â†’ test â†’ sign â†’ effect; a phase label always travels with its mislabelling test (knowledge/wyckoff/advance.md Â§2.11). BSL / SSL Â· ERL / IRL Buy-side / sell-side liquidity at equal highs and lows; external versus internal range liquidity (knowledge/ict/core-a.md Â§2.6â€“2.7, knowledge/ict/core-b.md Â§2.13). Sweep vs MSS A liquidity sweep runs through a level and closes back; a Market Structure Shift is a body close past the opposing swing after displacement (knowledge/ict/core-a.md Â§2.14, Â§2.17). Displacement Â· FVG A strong push leaves a Fair Value Gap (candle 1 and candle 3 do not overlap); the FVG is drawn until it is mitigated (knowledge/ict/core-a.md Â§2.16, Â§2.21). Order Block The last opposing candle before displacement; the OB line is that candle's open, mean threshold = 0.5 of the body; tight stop = body low (close), wide stop = the low of the sweep (knowledge/ict/core-b.md Â§2.5, re-checked against the PDF 2026-09-12). CISD Change in State of Delivery: a close through the open of the first candle in the last opposing-colour run into the level; earlier than the MSS (knowledge/ict/core-b.md Â§2.3, knowledge/ict/models.md Â§2.3). Dealing range Â· EQ Â· premium / discount The range is the nearest unswept BSLâ†”SSL pair (where the liquidity sits); EQ = 50%; buy in discount, sell in premium; with no pair, the window edges are used and said so (knowledge/ict/core-a.md Â§2.18â€“2.19). PDH/PDL Â· PWH/PWL Â· Asia/London session Previous day's, previous week's and session highs and lows are liquidity levels; a wick through that closes back = failure to displace (a reversal frame), a body close through = the level was the draw (knowledge/ict/core-a.md Â§2.8â€“2.9, Â§2.12, Â§2.14). The day boundary (00Z) and the session windows (session-model.md) are project assumptions. OTE Â· STD OTE: fib 1 at the leg's origin, 0 at its extreme, entry band 0.62â€“0.79, emphasis 0.705 (knowledge/ict/core-a.md Â§2.20). Std: 1 at the sweep's extreme, 0 at the prior highest high / lowest low; âˆ’2/âˆ’2.5 the exit band, âˆ’4 the maximum extension (knowledge/ict/core-b.md Â§2.12, knowledge/ict/models.md Â§2.1.5). Killzone Two sets of EST hours in the deck, with no rule for crypto or CFD (knowledge/ict/core-a.md Â§2.1, Â§6). The page draws them per docs/architecture/session-model.md: LDN 08â€“11 Europe/London, NY AM 08:30â€“11, NY PM 13:30â€“16 America/New_York, converted to UTC per date; weighting by market; not drawn at weekends â€” project parameters. POC Â· Imbalance Â· Stacked Imbalance The largest-volume level inside the candle; a diagonal bid/ask difference at or above the tool's ratio (knowledge/wyckoff/modern-tools.md Â§3.2). Absorption â†’ Exhaustion â†’ Development The reading sequence at the Spring/Upthrust anchor candle (knowledge/wyckoff/modern-tools.md Â§5 step 5). Delta / Cumulative Delta Strong / moderate / weak / hidden divergence at the Spring or UTAD location (knowledge/wyckoff/modern-tools.md Â§3.3). Liquidation cluster A price area where liquidation orders concentrate â€” a target, or a place to be run through (master spec). Orderbook wall Concentrated resting liquidity; where it coincides with a liquidation cluster it counts as one observation, not two."
